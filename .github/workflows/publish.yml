name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Publish to npm
        id: publish
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view agentic-forge version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "Publishing agentic-forge@$LOCAL_VERSION (npm has $PUBLISHED_VERSION)"
            npm publish --access public
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
            echo "previous_version=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "agentic-forge@$LOCAL_VERSION is already published, skipping"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists, skipping"
            exit 0
          fi
          PUBLISHED_VERSION=$(npm view agentic-forge version 2>/dev/null || echo "0.0.0")
          if [ "$VERSION" != "$PUBLISHED_VERSION" ] && [ "${{ steps.publish.outputs.published }}" != "true" ]; then
            echo "Version v${VERSION} not on npm and was not just published, skipping release"
            exit 0
          fi
          PREVIOUS="${{ steps.publish.outputs.previous_version }}"
          TAG_NAME="v${VERSION}"
          BODY_ARGS=()
          if [ -n "$PREVIOUS" ] && git rev-parse "v${PREVIOUS}" >/dev/null 2>&1; then
            BODY_ARGS=(-f previous_tag_name="v${PREVIOUS}")
          fi
          NOTES=$(gh api repos/{owner}/{repo}/releases/generate-notes \
            -f tag_name="$TAG_NAME" -f target_commitish=main "${BODY_ARGS[@]}" \
            --jq '.body')
          CHANGELOG=$(sed -n "/^## ${VERSION}$/,/^## /{ /^## ${VERSION}$/d; /^## /d; p; }" CHANGELOG.md)
          if [ -n "$CHANGELOG" ]; then
            printf -v NOTES '%s\n\n---\n\n## Changelog\n\n%s' "$NOTES" "$CHANGELOG"
          fi
          gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "$NOTES"
