# Annotated Reference Workflow
# This workflow demonstrates all available configuration options and step types
# Use this as a template for creating your own workflows

# Required: Unique workflow identifier
name: complete-workflow-example

# Required: Schema version
version: "1.0"

# Optional: Human-readable description
description: |
  Comprehensive example workflow demonstrating all available features:
  - All step types (prompt, skill, serial, parallel, conditional, ralph-loop, human-input,
    wait-for-review, wait-for-checks, merge)
  - Worktree isolation (workflow-level and step-level)
  - Error handling and retries
  - Checkpoints and progress tracking
  - Variable templating with Nunjucks
  - Output generation

# Optional: What the workflow needs from the harness. af refuses an unmet
# workflow before any step runs. `agentic-forge` is a version range
# (--ignore-requires overrides it with a warning); `contract` is the harness
# contract version and is never overridden.
requires:
  agentic-forge: ">=0.11"
  contract: 1

# Optional: Workflow-level settings
settings:
  # Maximum retry attempts for failed steps (default: 3)
  max-retry: 3

  # Maximum time for entire workflow in minutes (default: 60)
  timeout-minutes: 180

  # Track progress in progress.json in the run directory (default: true)
  track-progress: true

  # Auto-fix severity level: none, minor, major, critical (default: none)
  autofix: "major"

  # Terminal output mode: base (last message), all (stream all) (default: base)
  terminal-output: "base"

  # Bypass permission prompts - use with caution (default: false)
  bypass-permissions: false

  # Template variable handling: false = warn and continue, true = fail on undefined (default: false)
  strict-mode: false

  # Default model for all steps: sonnet, haiku, opus, fable (default: user-configured or sonnet)
  # These are aliases that always resolve to the latest model in that family.
  # Steps can override this with their own model setting.
  # Note: this value is NOT applied to steps that override `runtime` - it belongs
  # to the workflow runtime's model namespace.
  model: sonnet

  # Default coding agent runtime for all steps: claude, codex (default: claude)
  # Runtime resolution order: step.runtime > --runtime CLI flag > settings.runtime > config.defaults.runtime > "claude"
  # Note: slash-command prompts only work with runtime: claude (skill steps are inlined on codex)
  runtime: claude

  # Tools Claude can use without prompting (default: [])
  required-tools:
    - "Bash"
    - "Edit"
    - "Write"
    - "Read"

  # Worktree configuration (workflow-level isolation)
  worktree:
    # Enable worktree isolation for this workflow (default: false)
    # Accepts a boolean or Nunjucks template string for variable-driven toggling
    enabled: "{{ variables.use_worktree }}"

    # Where to create the worktree: sibling (default), nested, absolute
    location: "sibling"

    # Cleanup policy: on-success (default), on-complete, on-merge (after a merge
    # step reported merged: remove the worktree, then its branch), manual
    cleanup: "on-success"

  # Amend step (optional): the top-level step `af amend` runs at the next step
  # boundary. It receives the amendment as an "## Operator Messages" section,
  # writes plan.v<N>.md in {{ output_dir }}, and later steps read the latest
  # plan through {{ plan_path }}. Without it, an amendment is delivered to the
  # next step as an "Amendment:" operator message.
  amend:
    step: generate-plan

# Optional: Input variables for the workflow
variables:
  # Required string variable
  - name: task
    type: string
    required: true
    description: Task description for implementation

  # Optional string variable with default
  - name: plan_type
    type: string
    required: false
    default: "auto"
    description: Plan type (feature, bug, chore, auto)

  # Optional boolean variable
  - name: create_pr
    type: boolean
    required: false
    default: true
    description: Whether to create a pull request

  # Optional number variable
  - name: max_iterations
    type: number
    required: false
    default: 10
    description: Maximum iterations for ralph loop

  # Optional severity level
  - name: fix_severity
    type: string
    required: false
    default: "major"
    description: Minimum severity for auto-fixing issues

  # Optional boolean variable to toggle worktree mode
  - name: use_worktree
    type: boolean
    required: false
    default: true
    description: Whether to run the workflow in an isolated git worktree

# Required: Workflow steps
steps:
  # ==================== PROMPT STEP ====================
  # Execute a custom prompt in a Claude session
  - name: analyze-requirements
    type: prompt
    prompt: |
      Analyze the following task and provide a detailed breakdown:

      Task: {{ variables.task }}

      Provide:
      1. Key requirements
      2. Potential challenges
      3. Recommended approach

    # Optional: Timeout for this step (overrides workflow timeout)
    timeout-minutes: 15

    # Optional: Max retry attempts (overrides workflow setting)
    max-retry: 2

    # Optional: Error handling strategy (retry, skip, fail)
    on-error: retry

    # Optional: Create checkpoint after this step completes
    checkpoint: false

    # Optional: Override workflow-level bypass-permissions for this step only
    bypass-permissions: false

    # Optional: Override the runtime for this specific step
    # This is NEVER overridden by the --runtime CLI flag - step.runtime always wins
    # Example: run this analysis step with codex
    runtime: codex

    # Optional: Model to use. Must be valid for this step's runtime.
    # For claude, use an alias: "sonnet", "haiku", "opus", or "fable".
    # For codex, omit it (Codex CLI picks its own default) or pin an ID
    # such as "gpt-5.3-codex". Omitted here on purpose.

  # ==================== SKILL STEP ====================
  # Invoke a skill by namespace. On claude the prompt is:
  #   /<skill> <args> --run-dir <run dir> --config-snapshot <file>
  # On codex the skill's SKILL.md is sent inline (absolute paths, $ARGUMENTS filled).
  # The snapshot file holds af config skill_config.<plugin> ({} when unset).
  # The result block's `outputs` become {{ outputs.generate-plan.<key> }} for later steps.
  - name: generate-plan
    type: skill
    # Required: <plugin>:<skill> or <skill> (template, no leading slash)
    skill: esp-skills:esp-plan
    # Optional: arguments after the skill name (template)
    args: "--type {{ variables.plan_type }} {{ variables.task }}"
    timeout-minutes: 20

  # ==================== SERIAL STEP ====================
  # Execute nested steps sequentially
  - name: sequential-implementation
    type: serial
    steps:
      - name: setup-environment
        type: prompt
        prompt: "Prepare the development environment for implementation"

      - name: install-dependencies
        type: prompt
        prompt: "Install required dependencies"

      - name: create-files
        type: prompt
        prompt: "Create necessary files and directory structure"

  # ==================== PARALLEL STEP ====================
  # Execute nested steps concurrently in isolated git worktrees
  - name: parallel-analysis
    type: parallel

    # Run each parallel step in a separate git worktree (default: false)
    # Inherits location and cleanup settings from settings.worktree
    worktree: true

    # How to handle branch failures: "fail" (default) or "warn" (log warning, continue)
    on-failure: warn

    # Parallel steps
    steps:
      - name: security-scan
        type: prompt
        prompt: Review the code for security issues and list them in {{ output_dir }}/security.md
        on-error: skip # Don't fail workflow if security scan fails

      - name: style-check
        type: prompt
        prompt: Review the code for style issues and list them in {{ output_dir }}/style.md
        on-error: skip

      - name: bug-detection
        type: skill
        # Any installed skill works here; esp-skills is one example pack
        skill: esp-skills:esp-analyze
        args: "--type bug"
        on-error: skip

      - name: debt-analysis
        type: prompt
        # agent: prepends an instructions file, resolved relative to this
        # workflow file, then the repo root (agentic-forge bundles no agents)
        agent: agents/debt-finder.md
        prompt: Find technical debt and list it in {{ output_dir }}/debt.md
        on-error: skip

  # ==================== RALPH LOOP STEP ====================
  # Iterative prompt execution with completion detection
  # Iteration boundaries are safe points: `af pause` stops between iterations,
  # and `af send` messages are prepended to the next iteration prompt as an
  # "## Operator Messages" section (no placeholder needed)
  - name: implement-incrementally
    type: ralph-loop

    # Prompt executed in each iteration
    prompt: |
      ## Ralph Loop Iteration

      Read the implementation plan at {{ output_dir }}/plan.md

      Implement the NEXT INCOMPLETE milestone:
      1. Read the plan and identify the next incomplete milestone
      2. Implement all tasks in that milestone
      3. Run tests to verify your implementation
      4. Commit your changes with a descriptive message
      5. Mark the milestone as complete in the plan file

      **IMPORTANT**: When ALL milestones in the plan are marked as complete, output:
      ```json
      {"ralph_complete": true, "promise": "ALL_MILESTONES_COMPLETE"}
      ```

      Do NOT output the completion JSON until every milestone is genuinely finished.

      Current iteration state is tracked in {{ output_dir }}/ralph-implement-incrementally.md

    # Maximum iterations before stopping (can use variable)
    max-iterations: "{{ variables.max_iterations }}"

    # Completion promise text to match in JSON output
    completion-promise: "ALL_MILESTONES_COMPLETE"

    # Model to use for each iteration
    model: sonnet

    # Create checkpoint after loop completes
    checkpoint: true

    # Timeout for entire loop
    timeout-minutes: 120

  # ==================== REVIEW STEP ====================
  - name: review-implementation
    type: skill
    skill: esp-skills:esp-review
    args: "--plan {{ output_dir }}/plan.md"
    checkpoint: true

  # ==================== CONDITIONAL STEP ====================
  # Execute steps based on Nunjucks condition
  - name: fix-validation-issues
    type: conditional

    # Nunjucks expression that evaluates to true/false
    # This checks if there are any issues with severity >= fix_severity
    condition: "{{ outputs.review_implementation.issues | selectattr('severity', 'ge', variables.fix_severity) | list | length > 0 }}"

    # Steps to execute if condition is true
    then:
      - name: apply-fixes
        type: prompt
        prompt: |
          The validation found issues that need to be fixed.

          Issues to fix (severity {{ variables.fix_severity }} or higher):
          {{ outputs.review_implementation.issues | tojson(indent=2) }}

          Please fix these issues and commit your changes.
        model: sonnet
        timeout-minutes: 30

      - name: re-review
        type: skill
        skill: esp-skills:esp-review

    # Steps to execute if condition is false
    else:
      - name: log-success
        type: prompt
        prompt: "Validation passed! No issues found at severity {{ variables.fix_severity }} or higher."

  # ==================== HUMAN INPUT STEP ====================
  # Ask a question through needs_input and wait for `af answer` (or `af input`).
  # No coding agent runs. The run is awaiting-human until the answer arrives;
  # the step then completes with outputs: answer, option, from, request_id.
  # (`wait-for-human` from before 0.12 still parses as an alias.)
  - name: request-approval
    type: human-input

    # Required: the question (template)
    message: "Create a PR for {{ variables.task }}?"

    # Optional: background for the answerer (template)
    context: |
      Plan: {{ plan_path }}
      Review results: {{ outputs.review_implementation | tojson }}

    # Optional: strings (id = label with dashes) or { id, label, description }.
    # Empty or omitted: free-form answer.
    options:
      - approved
      - { id: rejected, label: Rejected, description: Stop without a PR }

    # Optional: id of the recommended option
    recommended: approved

    # Optional (default: true): false lets the harness apply `recommended`
    # after timeout-minutes (or supervisor.needs_input_timeout)
    blocking: false

    # Optional: only with blocking: false and recommended
    timeout-minutes: 120

  # ==================== CONDITIONAL STEP (CREATE PR) ====================
  - name: create-pull-request
    type: conditional
    condition: "{{ variables.create_pr and outputs['request-approval'].answer == 'approved' }}"
    then:
      - name: open-pr
        type: prompt
        prompt: |
          Push the branch and open a pull request titled
          "[{{ variables.plan_type }}] {{ outputs.generate_plan.summary }}" with `gh pr create`.

      # ==================== GITHUB STEPS ====================
      # The supervisor polls GitHub with gh: no coding agent runs while these
      # wait. The pull request is `pr:` (template), else the run's pr (from a
      # result block), else the pull request of the current branch.
      # Not allowed under a parallel step.
      - name: wait-review
        type: wait-for-review
        # Names from github.reviewers (claude, codex) or GitHub logins
        reviewers: [claude, codex]
        # Optional: post "@codex review" once per head when Codex has not reviewed it
        trigger: true
        # Optional: first polling interval (doubles up to github.max_poll_seconds)
        poll-seconds: 30
        # Optional: then the run stops awaiting-human (af answer: wait | continue)
        timeout-minutes: 30

      - name: wait-checks
        type: wait-for-checks
        # Optional: required (default; all checks when the base requires none) | all
        checks: required
        # Optional: fail (default) | continue (result in outputs['wait-checks'].result)
        on-fail: fail

      # Merge under the per-repository merge lock. Without `skill`, gh pr merge
      # --repo with the method resolved from the repository settings; with
      # `skill: esp-skills:esp-merge`, the skill runs with AF_MERGE_LOCK set.
      - name: merge-pr
        type: merge
        # Optional: repo (default, resolve) | squash | rebase | merge
        method: repo
        # Optional: delete the remote head branch (default github.merge.delete_branch)
        delete-branch: true

  # ==================== FINAL SUMMARY ====================
  - name: generate-summary
    type: prompt
    prompt: |
      Generate a summary of the workflow execution.

      Include:
      - Task: {{ variables.task }}
      - Plan type: {{ variables.plan_type }}
      - Review results: {{ outputs.review_implementation | tojson }}
      - PR created: {{ outputs.create_pull_request is defined }}

      Save the summary to {{ output_dir }}/summary.md

# Optional: Output artifacts
outputs:
  # Generated when workflow completes successfully
  - name: implementation-report
    # Nunjucks template file (resolved from workflow dir, agentic/templates/, or bundled templates;
    # the only bundled template is ralph-report.md.j2, so provide this one yourself)
    template: implementation-report.md.j2
    # Output file path (relative to workflow directory)
    path: "{{ output_dir }}/report.md"
    # When to generate: completed or failed
    when: completed

  # Generated when workflow fails
  - name: error-report
    template: error-report.md.j2
    path: "{{ output_dir }}/error.md"
    when: failed

# ==================== USAGE EXAMPLES ====================
#
# Run with bare key=value args (preferred):
#   agentic-forge run workflow-example.yaml task="Add user authentication"
#
# Run with --var flag (equivalent):
#   agentic-forge run workflow-example.yaml --var "task=Add user authentication"
#
# Run with multiple variables:
#   agentic-forge run workflow-example.yaml \
#     task="Fix login bug" \
#     plan_type=bug \
#     create_pr=true \
#     max_iterations=15
#
# Run with verbose output:
#   agentic-forge run workflow-example.yaml \
#     task="Implement feature" \
#     --terminal-output all
#
# Disable interactive prompts (for CI/scripts):
#   agentic-forge run workflow-example.yaml --no-interactive \
#     task="Implement feature"
#
# Resume from specific step:
#   agentic-forge run workflow-example.yaml \
#     task="Implement feature" \
#     --from-step review-implementation
#
# Provide human input:
#   agentic-forge input <workflow-id> "approved"
#
# Check workflow status:
#   agentic-forge status <workflow-id>
#
# ==================== SKILLS ====================
#
# agentic-forge bundles no execution skills. Call the skills you installed
# (Claude Code plugins, ~/.claude/skills/, the repo's .claude/skills/) with a
# `skill` step, using fully qualified <plugin>:<skill> names to avoid conflicts
# with skills from other plugins or built-in commands. The esp-skills steps in
# this example (esp-skills:esp-plan, esp-skills:esp-review,
# esp-skills:esp-analyze) need that plugin: /plugin install esp-skills@esp
# Without a skill pack, write the instructions in a prompt step instead.
#
# ==================== BUILT-IN VARIABLES ====================
#
# Available in all Nunjucks templates:
#   - {{ workflow_id }}              - Unique workflow execution ID
#   - {{ workflow_name }}            - Workflow name from YAML
#   - {{ variables.name }}           - User-defined variables
#   - {{ outputs.step_name.field }}  - Step outputs
#
# ==================== NUNJUCKS FILTERS ====================
#
# Common filters for templating:
#   - {{ list | length }}            - Get list length
#   - {{ list | first }}             - Get first item
#   - {{ list | last }}              - Get last item
#   - {{ list | selectattr('key', 'eq', 'value') }}  - Filter list
#   - {{ text | upper }}             - Uppercase
#   - {{ text | lower }}             - Lowercase
#   - {{ data | tojson }}            - Convert to JSON
#   - {{ data | tojson(indent=2) }}  - Pretty JSON
