name: codex-demo
version: "1.0"
description: Demo workflow using the Codex runtime to validate multi-runtime support

settings:
  runtime: codex
  model: gpt-5.4
  track-progress: true
  terminal-output: all
  bypass-permissions: false

steps:
  - name: welcome
    type: prompt
    prompt: |
      # Welcome to the agentic-forge Codex Demo Workflow

      This is a demonstration workflow that validates Codex runtime support in agentic-forge.

      Please acknowledge this welcome message by saying: "Codex demo workflow started successfully."

  - name: create-demo-files
    type: parallel
    steps:
      - name: create-demo-1
        type: prompt
        prompt: |
          Create a file named `codex-demo-1.md` at the repository root.

          The file should contain:
          ```markdown
          # Codex Demo File 1

          Created by: agentic-forge codex-demo
          Timestamp: [current timestamp]
          Step: create-demo-1
          Runtime: codex

          This file was created to validate Codex runtime workflow execution.
          ```

          Use the Write tool to create this file.

          IMPORTANT: If you encounter a permission error when trying to write this file,
          you MUST stop immediately and report: "PERMISSION ERROR: Unable to write codex-demo-1.md"
          Do not attempt any workarounds.

      - name: create-demo-2
        type: prompt
        prompt: |
          Create a file named `codex-demo-2.md` at the repository root.

          The file should contain:
          ```markdown
          # Codex Demo File 2

          Created by: agentic-forge codex-demo
          Timestamp: [current timestamp]
          Step: create-demo-2
          Runtime: codex

          This file was created to validate Codex runtime workflow execution.
          ```

          Use the Write tool to create this file.

          IMPORTANT: If you encounter a permission error when trying to write this file,
          you MUST stop immediately and report: "PERMISSION ERROR: Unable to write codex-demo-2.md"
          Do not attempt any workarounds.

  - name: random-facts-loop
    type: ralph-loop
    max-iterations: 5
    completion-promise: THREE_FACTS_WRITTEN
    prompt: |
      ## Random Facts Loop - Iteration {{iteration}}/{{max_iterations}}

      You are in an iterative loop adding random knowledge facts to codex-demo-1.md.

      ## Your Task
      1. Read the file `codex-demo-1.md` at the repository root
      2. Add ONE new numbered random knowledge fact to the "Random Facts" section
      3. If the "Random Facts" section does not exist, create it at the end of the file
      4. Save the file and STOP (exit the session)

      ## Random Facts Section Format
      ```markdown
      ## Random Facts

      1. [Your first random fact here]
      2. [Your second random fact here]
      ...
      ```

      ## Exit Instructions
      - After adding ONE fact, you MUST exit the session immediately
      - Do NOT add multiple facts in a single iteration
      - Simply stop working after saving the file - the loop will automatically continue

      ## Completion Condition
      When the file contains EXACTLY 3 numbered facts in the Random Facts section, output:
      ```json
      {"ralph_complete": true, "promise": "THREE_FACTS_WRITTEN"}
      ```

      **IMPORTANT**:
      - Count the existing facts BEFORE adding a new one
      - If there are already 2 facts, add the 3rd fact and THEN output the completion JSON
      - If there are already 3 or more facts, output the completion JSON immediately without adding more
      - If there are 0-1 facts, add ONE fact and then STOP (do not output completion JSON yet)

  - name: git-branch
    type: prompt
    prompt: |
      Create a new git branch for the codex demo.

      Run the following commands:
      1. `git checkout -b demo/codex-random-facts`

      After running the command, confirm the branch was created by running:
      - `git branch --show-current`

      Report the current branch name.

  - name: git-commit
    type: prompt
    prompt: |
      Commit the demo files to the repository.

      Run the following commands in sequence:
      1. `git add codex-demo-1.md codex-demo-2.md`
      2. `git commit -m "[Codex Demo] Add codex demo files with random facts"`

      After committing, confirm with:
      - `git log -1 --oneline`

      Report the commit message.

  - name: completion
    type: prompt
    prompt: |
      # Codex Demo Workflow Complete

      The agentic-forge Codex demo workflow has finished executing.

      ## Validation Tasks

      You MUST verify ALL of the following before reporting completion:

      ### 1. File Validation
      - Read `codex-demo-1.md` and verify it exists at the repository root
      - Read `codex-demo-2.md` and verify it exists at the repository root

      ### 2. Random Facts Validation
      - Verify that `codex-demo-1.md` contains a "Random Facts" section with EXACTLY 3 numbered facts
      - Count the facts to confirm there are 3

      ### 3. Git Branch Validation
      - Run `git branch --show-current` to check the current branch
      - Verify the current branch is `demo/codex-random-facts`

      ### 4. Git Commit Validation
      - Run `git log -1 --oneline` to check the most recent commit
      - Verify a commit exists with a message containing "codex" or "random facts"

      ## Reporting

      After performing ALL validations, report the results:

      If ALL validations passed, say:
      "CODEX DEMO WORKFLOW COMPLETED SUCCESSFULLY - Codex runtime is working correctly!

      Validation Summary:
      - codex-demo-1.md: Created with 3 random facts
      - codex-demo-2.md: Created
      - Git branch: demo/codex-random-facts
      - Git commit: [commit message]"

      If ANY validation failed, report which ones and end with:
      "CODEX DEMO WORKFLOW COMPLETED WITH ISSUES - Please review the errors above."

      Remind the user to clean up by running:
      - `git checkout main`
      - `git branch -D demo/codex-random-facts`
      - Delete codex-demo-1.md and codex-demo-2.md
