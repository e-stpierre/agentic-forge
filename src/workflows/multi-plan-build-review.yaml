name: multi-plan-build-review
version: "1.0"
description: Full SDLC workflow using mixed runtimes - Claude for planning and implementation, Codex for review

settings:
  max-retry: 3
  timeout-minutes: 180
  terminal-output: base
  track-progress: true
  worktree:
    enabled: "{{ variables.use_worktree }}"
    cleanup: "on-success"

variables:
  - name: task
    type: string
    required: true
    description: Feature/task description
  - name: type
    type: string
    required: false
    default: "auto"
    description: Task type (feature, bug, chore, auto)
  - name: fix_severity
    type: string
    required: false
    default: "major"
    description: Minimum severity for auto-fix
  - name: explore_agents
    type: integer
    required: false
    default: 2
    description: Number of explore agents for codebase analysis (0=quick main session, 1+=parallel agents)
  - name: max_iterations
    type: number
    required: false
    default: 25
    description: Maximum iterations for implementation and review fixes loops
  - name: create_branch
    type: boolean
    required: false
    default: true
    description: Whether to create a new branch before implementation
  - name: create_pr
    type: boolean
    required: false
    default: false
    description: Whether to create a PR
  - name: use_worktree
    type: boolean
    required: false
    default: true
    description: Whether to run in an isolated worktree

steps:
  - name: plan
    type: prompt
    runtime: claude
    model: opus
    prompt: /af-sdlc-plan {{ workflow_id }} {{ variables.type }} "{{ output_dir }}" {{ variables.explore_agents }} {{ variables.task }}
    checkpoint: true

  - name: plan-review
    type: prompt
    runtime: codex
    model: gpt-5.4
    prompt: |
      ## Plan Review and Refinement

      Read the implementation plan at `{{ output_dir }}/plan.md`.

      Your task is to review the plan for medium and higher severity issues, and fix
      them directly in the plan. The implementation loop reads milestones sequentially,
      so changes must be applied inline where the issue exists.

      ### Review Criteria (medium+ severity only)

      Focus on issues that would cause implementation to fail or produce incorrect results:
      - **Critical**: Missing steps that would break the build, incorrect dependencies,
        security vulnerabilities in the design
      - **Major**: Wrong task ordering, missing error handling for likely failure paths,
        incomplete milestone scope, feasibility issues
      - **Medium**: Missing edge cases that are reasonably likely, test coverage gaps
        for core functionality

      **Skip minor issues** like naming suggestions, stylistic preferences, or
      hypothetical edge cases.

      ### Instructions

      1. **Read the plan** carefully, milestone by milestone
      2. **Identify real issues** at medium severity or above - be conservative,
         only flag things that would genuinely cause problems during implementation
      3. **Fix issues directly in the plan**: modify milestone descriptions, add missing
         tasks, reorder steps, fix dependencies - edit the content inline where the
         issue lives
      4. **Append a brief "Plan Review Summary" section** at the very end with:
         - Number of issues found and fixed
         - A short bullet list of what was changed and why
         - If no issues were found, state that the plan passed review unchanged

      This summary section is for debugging only - the implementation loop may not read it.
      All meaningful fixes must be applied directly to the milestone content above.

      Use the Write tool to update the plan file.

  - name: create-branch
    type: conditional
    condition: "variables.create_branch"
    then:
      - name: run-create-branch
        type: prompt
        runtime: claude
        model: haiku
        prompt: /af-git-branch {{ variables.type }} {{ variables.task }}

  - name: implement
    type: ralph-loop
    runtime: claude
    prompt: |
      ## Implementation Loop - Iteration {{iteration}}/{{max_iterations}}

      You are in an iterative implementation loop. Each iteration starts a fresh session.

      ## Your Task This Iteration
      Read the plan at {{ output_dir }}/plan.md and implement the NEXT INCOMPLETE milestone.

      ## How Iterations Work
      - Each iteration is a FRESH SESSION - you have no memory of previous iterations
      - Work on exactly ONE milestone per iteration, then STOP
      - The loop automatically starts a new iteration after you stop
      - You do NOT need to output anything special to end an iteration - just stop working

      ## Instructions for This Iteration
      1. Read the plan file to find the next incomplete milestone
      2. Implement all tasks within that single milestone
      3. Run tests to verify your changes
      4. Mark the milestone as complete in the plan file
      5. Use /af-git-commit to commit your changes (including the plan.md if not gitignored)
      6. STOP - do not continue to the next milestone

      ## Completion Signal
      When ALL milestones are marked complete in the plan, output:
      ```json
      {"ralph_complete": true, "promise": "ALL_MILESTONES_COMPLETE"}
      ```

      **IMPORTANT**:
      - Only output the completion JSON when ALL milestones are genuinely finished and every validation completed successfully
      - Complete ONE milestone per iteration, then STOP
      - Do NOT try to implement multiple milestones in a single iteration
    max-iterations: "{{ variables.max_iterations }}"
    completion-promise: "ALL_MILESTONES_COMPLETE"
    checkpoint: true

  - name: review
    type: parallel
    steps:
      - name: claude-review
        type: prompt
        runtime: claude
        prompt: /af-sdlc-review {{ workflow_id }} "{{ output_dir }}/plan.md" "{{ output_dir }}" minor
        agent: agents/reviewer.md

      - name: codex-review
        type: prompt
        runtime: codex
        model: gpt-5.4
        prompt: |
          ## Code Review

          Read the implementation plan at `{{ output_dir }}/plan.md` to understand what was built.

          Then perform a thorough code review of the changes by:

          1. **Reading the plan** to understand the intended design and milestones
          2. **Reviewing the implementation** - examine relevant source files mentioned in the plan
          3. **Checking for issues** across these categories:
             - Correctness: Does the code do what the plan says?
             - Edge cases: Are error paths handled?
             - Security: Any obvious vulnerabilities?
             - Performance: Any inefficiencies?
             - Style: Does it follow existing codebase conventions?

          4. **Writing a review file** at `{{ output_dir }}/codex-review.md` with:
             ```markdown
             # Codex Code Review

             ## Summary
             [Brief assessment of the implementation quality]

             ## Issues

             | Severity | File | Issue |
             |----------|------|-------|
             | critical/major/minor | file:line | description |

             ## Recommendations
             [List of improvement suggestions]

             ## Verdict
             [APPROVED / NEEDS_CHANGES / REJECTED]
             ```

  - name: fix-issues
    type: prompt
    runtime: claude
    prompt: |
      ## Fix Review Issues

      Read all review documents from the workflow output directory:
      - Plan: `{{ output_dir }}/plan.md`
      - Claude Review: `{{ output_dir }}/review.md`
      - Codex Review: `{{ output_dir }}/codex-review.md`

      ### Task

      1. **Parse both review files** to identify all issues from the Issues tables
      2. **Merge and deduplicate** issues across both reviews
      3. **Filter by severity**: Only consider issues with severity `{{ variables.fix_severity }}` or higher
         - Severity order: minor < major < critical
      4. **If no issues** at or above `{{ variables.fix_severity }}` severity exist:
         - Output success and end the session
         - Return: `{"success": true, "issues_fixed": 0, "issues_remaining": 0}`
      5. **If issues exist**, attempt to fix each one:
         - For each issue, make the necessary code changes
         - Run relevant checks (tests, lint, types, build) to verify the fix
         - Track which issues were fixed and which could not be fixed
      6. **After attempting fixes**:
         - Use /af-git-commit to commit all fixes
         - Re-run /af-sdlc-review {{ workflow_id }} "{{ output_dir }}/plan.md" to update the Review section

      ### Critical Requirement

      After fixing, if ANY `major` or `critical` issues remain unfixed, you MUST:
      - Output an error indicating which issues could not be fixed
      - Return: `{"success": false, "error": "Unfixable issues remain", "issues_remaining": [...]}`

      This will prevent the workflow from proceeding to the PR step.

      ### Output

      Return JSON with fix results:
      ```json
      {
        "success": [true|false],
        "issues_fixed": [count],
        "issues_remaining": [count],
        "unfixed_issues": ["issue1", "issue2"],
        "error": "[error_message_if_failed]"
      }
      ```

  - name: create-pr
    type: conditional
    condition: "variables.create_pr"
    then:
      - name: open-pr
        type: prompt
        runtime: claude
        prompt: /af-git-pr "{{ outputs.plan.summary }}"

outputs:
  - name: implementation-report
    template: implementation-report.md.j2
    path: report.md
    when: completed
